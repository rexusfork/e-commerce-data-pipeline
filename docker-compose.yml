
services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: ecommerce-airflow
    restart: unless-stopped

    command: standalone

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta

      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      PYTHONPATH: /opt/project:/opt/project/src

      PYTHONUNBUFFERED: "1"

    volumes:
      - .:/opt/project:ro
      - airflow_home:/opt/airflow

volumes:
  postgres_data:
  airflow_home:
